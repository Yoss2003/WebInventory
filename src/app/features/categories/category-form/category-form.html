<app-modal-shell
  type="mainForm"
  title="Nueva categoría"
  subtitle="Registra una categoría principal para organizar tus artículos"
  icon="category"
  [infoVisible]="true"
  infoTooltip="Las categorías permiten organizar los artículos del inventario."
  [closeVisible]="false"
  [footerActions]="modalFooterActions"
  [busyActionId]="isSaving ? 'primary' : null"
  (actionClicked)="handleModalAction($event)"
  (closeRequested)="dialogRef.close()">
  <form [formGroup]="categoryForm" class="category-simple-form" autocomplete="off" (ngSubmit)="onSubmit()">
    <div class="category-field">
      <label for="category-name">Nombre de la categoría <span class="required">*</span></label>
      <input id="category-name" appUiControl formControlName="name" type="text"
             placeholder="Ej. Electrónicos" maxlength="255"
             [class.invalid]="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched" />
      <span class="field-error" *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
        Escribe el nombre de la categoría.
      </span>
    </div>

    <div class="category-field">
      <label for="category-description">Descripción <span class="optional">(opcional)</span></label>
      <textarea id="category-description" appUiControl formControlName="description" rows="3"
                placeholder="Describe brevemente esta categoría"></textarea>
    </div>
  </form>
</app-modal-shell>
