<app-modal-shell
  class="inv-modal-adaptive-height"
  type="selector"
  title="Unidades de medida"
  subtitle="Elige las unidades permitidas en esta categoría hija"
  icon="straighten"
  [infoVisible]="false"
  [closeVisible]="false"
  [footerActions]="modalFooterActions"
  (actionClicked)="handleModalAction($event)"
  [contentScrollable]="false" (closeRequested)="cancel()">
  <div class="unit-picker">
  <div class="unit-picker__body">
    <div class="unit-picker__search-heading">
      <label class="unit-picker__search-label" for="unit-picker-search">Buscar por nombre o abreviatura</label>
      <span class="unit-picker__invalid" *ngIf="selectedCount === 0" role="status">Selecciona al menos una unidad de medida.</span>
    </div>
    <div class="unit-picker__search">
      <mat-icon>search</mat-icon>
      <input id="unit-picker-search" type="search" [value]="search" (input)="onSearch($event)" autocomplete="off" placeholder="Ej. cajas, BOX, gramos..." />
    </div>

    <div class="unit-picker__actions">
      <div class="unit-picker__count">{{selectedCount}} seleccionadas · {{visibleUnits.length}} resultados</div>
      <button type="button" appUiButton="secondary" (click)="selectAllVisible()" [disabled]="visibleUnits.length === 0 || allVisibleSelected">Seleccionar todas</button>
      <button type="button" appUiButton="secondary" (click)="clearAllVisible()" [disabled]="selectedVisibleCount === 0">Deseleccionar todas</button>
    </div>
    <p *ngIf="search.trim()" class="unit-picker__filter-note">Estas dos acciones se aplican a los resultados visibles de la búsqueda.</p>

    <div class="unit-picker__list" role="group" aria-label="Unidades disponibles">
      <div class="unit-picker__option" *ngFor="let unit of visibleUnits; trackBy: trackByUnit">
        <mat-checkbox [checked]="selected.has(unit.id)" (change)="toggle(unit.id, $event.checked)">
          <span class="unit-picker__name">{{unit.unitName}}</span>
        </mat-checkbox>
        <span class="unit-picker__abbr">{{unit.abbreviation.trim()}}</span>
      </div>
      <p class="unit-picker__empty" *ngIf="visibleUnits.length === 0">No se encontraron unidades con esa búsqueda.</p>
    </div>
  </div>
  </div>
</app-modal-shell>
