<app-modal-shell
  class="inv-modal-adaptive-height ui-v2-dialog--special"
  type="mainForm"
  [title]="isEdit ? 'Editar categoría padre' : 'Nueva categoría padre'"
  icon="category"
  [infoVisible]="true"
  [sectionsVisible]="false"
  infoTooltip="Organiza las categorías principales de tu inventario. Las categorías padre agrupan subcategorías y permiten mantener estructurado el catálogo."
  [closeVisible]="false"
  [footerActions]="modalFooterActions"
  [busyActionId]="isSaving ? 'primary' : null"
  [contentScrollable]="true"
  (actionClicked)="handleModalAction($event)"
  (closeRequested)="dialogRef.close()">
  <div class="parent-modal">
    <app-loading-indicator *ngIf="loadingInventories" message="Cargando inventarios del formulario..." />

    <form *ngIf="!loadingInventories" [formGroup]="parentForm" class="parent-form" autocomplete="off">
      <section class="parent-card">
        <div class="section-header">
          <span class="section-icon"><mat-icon>sell</mat-icon></span>
          <div>
            <h3>Datos de la categoría</h3>
            <p>Información del grupo principal</p>
          </div>
        </div>

        <div class="field">
          <label for="parent-inventory">Inventario / almacén <span class="required">*</span></label>
          <mat-form-field appearance="outline" class="inventory-select">
            <mat-select id="parent-inventory" formControlName="inventoryId" panelClass="inventory-select-options" placeholder="Seleccionar almacén">
              <mat-option *ngFor="let i of inventories" [value]="i.id">{{ i.alias || i.inventoryName }}</mat-option>
            </mat-select>
          </mat-form-field>
          <small *ngIf="!isEdit && !inventories.length">Necesitas un inventario registrado para crear categorías.</small>
        </div>

        <div class="field">
          <label for="parent-category-name">Nombre del grupo <span class="required">*</span></label>
          <input appUiControl id="parent-category-name" class="parent-input" type="text" formControlName="name"
                 maxlength="255" placeholder="Ej. Abarrotes"
                 [class.invalid]="parentForm.get('name')?.invalid && parentForm.get('name')?.touched" />
          <small class="field-error" *ngIf="parentForm.get('name')?.hasError('required') && parentForm.get('name')?.touched">
            Escribe el nombre del grupo.
          </small>
        </div>

        <div class="field">
          <label for="parent-category-description">Descripción <span class="optional">(opcional)</span></label>
          <textarea appUiControl id="parent-category-description" class="parent-input parent-textarea"
                    formControlName="description" rows="3" placeholder="¿Qué productos pertenecen a este grupo?"></textarea>
        </div>

        <p class="save-error" *ngIf="saveError" role="alert">{{ saveError }}</p>
      </section>
    </form>
  </div>
</app-modal-shell>
