<app-modal-shell
  type="mainForm"
  [title]="editing ? 'Editar proveedor' : 'Nuevo proveedor'"
  icon="local_shipping"
  [sections]="[]"
  [sectionsVisible]="false"
  [infoVisible]="true"
  infoTooltip="Catálogo maestro de la empresa. Consulta el RUC para completar los datos fiscales disponibles y registra manualmente los medios de contacto."
  [closeVisible]="false"
  [footerActions]="modalFooterActions"
  [busyActionId]="saving ? 'primary' : null"
  (actionClicked)="handleModalAction($event)"
  [contentScrollable]="true" (closeRequested)="close()">
  <div class="supplier-modal">
  <form [formGroup]="form" class="supplier-modal__body" (ngSubmit)="save()">
    <section class="supplier-modal__section">
      <div class="supplier-modal__section-title"><mat-icon>verified</mat-icon><div><h3>Identificación fiscal</h3><p>Consulta el RUC para completar los datos básicos.</p></div></div>
      <div class="supplier-modal__fiscal-grid">
        <div class="supplier-modal__ruc-row">
          <label class="supplier-modal__field">
            <span>RUC <b>*</b></span>
            <input appUiControl formControlName="ruc" maxlength="11" inputmode="numeric" placeholder="11 dígitos" />
            <small *ngIf="form.controls.ruc.touched && form.controls.ruc.invalid">El RUC debe contener exactamente 11 dígitos.</small>
          </label>
          <button type="button" appUiButton="secondary" class="supplier-modal__lookup" (click)="lookupRuc()" [uiButtonLoading]="lookingUpRuc" [uiButtonLoadingText]="'Consultando...'" [disabled]="lookingUpRuc || saving || form.controls.ruc.invalid">
            <mat-icon>manage_search</mat-icon>Consultar RUC
          </button>
        </div>
        <label class="supplier-modal__field">
          <span>Razón social <b>*</b></span>
          <input appUiControl formControlName="businessName" maxlength="250" placeholder="Razón social del proveedor" />
          <small *ngIf="form.controls.businessName.touched && form.controls.businessName.invalid">Ingresa una razón social de hasta 250 caracteres.</small>
        </label>
      </div>
      <div class="supplier-modal__fiscal" *ngIf="fiscalStatus || fiscalCondition">
        <span *ngIf="fiscalStatus">Estado: <strong>{{fiscalStatus}}</strong></span>
        <span *ngIf="fiscalCondition">Condición: <strong>{{fiscalCondition}}</strong></span>
      </div>
    </section>

    <section class="supplier-modal__section">
      <div class="supplier-modal__section-title"><mat-icon>contact_phone</mat-icon><div><h3>Datos de contacto</h3><p>Información para comunicarse con el proveedor.</p></div></div>
      <div class="supplier-modal__grid">
        <label class="supplier-modal__field"><span>Contacto</span><input appUiControl formControlName="contactName" maxlength="150" placeholder="Nombre del vendedor o asesor" /></label>
        <label class="supplier-modal__field"><span>Teléfono</span><input appUiControl formControlName="phone" maxlength="50" placeholder="Teléfono de contacto" /></label>
        <label class="supplier-modal__field"><span>Correo electrónico</span><input appUiControl formControlName="email" maxlength="100" type="email" placeholder="ventas@proveedor.com" /><small *ngIf="form.controls.email.touched && form.controls.email.invalid">Ingresa un correo válido.</small></label>
        <label class="supplier-modal__field"><span>Dirección fiscal</span><input appUiControl formControlName="address" maxlength="500" placeholder="Dirección registrada" /></label>
      </div>
      <label class="supplier-modal__field supplier-modal__wide"><span>Descripción de la relación comercial</span><textarea appUiControl formControlName="relationshipDescription" maxlength="700" rows="3" placeholder="Condiciones, acuerdos u observaciones sobre este proveedor."></textarea></label>
    </section>
  </form>
  </div>
</app-modal-shell>
