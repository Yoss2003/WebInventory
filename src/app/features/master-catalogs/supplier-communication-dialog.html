<section class="supplier-communication-dialog ui-v2-dialog ui-v2-dialog--simple">
  <header class="dialog-head">
    <div>
      <h2>Datos de comunicación</h2>
      <p>Registra los medios de contacto del proveedor</p>
    </div>
    <button type="button" appUiButton="close" (click)="close()" aria-label="Cerrar datos de comunicación">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>
  <form class="dialog-content" (ngSubmit)="save()">
    <label>Nombre de contacto
      <input [(ngModel)]="data.contactName" name="contactName" maxlength="150" appUiControl />
    </label>
    <label>Teléfono
      <input [(ngModel)]="data.phone" name="phone" type="tel" maxlength="40" appUiControl />
    </label>
    <label>Correo electrónico
      <input [(ngModel)]="data.email" name="email" type="email" maxlength="254" appUiControl />
    </label>
    <footer class="dialog-actions">
      <button type="button" appUiButton="secondary" (click)="close()">Cancelar</button>
      <button type="submit" appUiButton="primary">Aplicar datos</button>
    </footer>
  </form>
</section>
