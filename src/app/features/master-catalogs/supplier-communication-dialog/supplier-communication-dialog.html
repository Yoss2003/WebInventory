<app-modal-shell type="subTask" title="Datos de comunicación" subtitle="Registra los medios de contacto del proveedor" icon="contact_mail" [infoVisible]="false" [closeVisible]="false" [footerActions]="modalFooterActions" (actionClicked)="handleModalAction($event)" (closeRequested)="close()">
<section class="supplier-communication-dialog ui-v2-dialog ui-v2-dialog--simple">
  <form class="dialog-content" (ngSubmit)="save()">

    <label>Nombre de contacto
      <input [(ngModel)]="data.contactName" name="contactName" maxlength="150" appUiControl />
    </label>
    <label>Teléfono
      <input [(ngModel)]="data.phone" name="phone" type="tel" maxlength="40" appUiControl />
    </label>
    <label>Correo electrónico
      <input [(ngModel)]="data.email" name="email" type="email" maxlength="254" appUiControl />
    </label>
    
</form>
  </section>
</app-modal-shell>
