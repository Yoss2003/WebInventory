<section class="supplier-fiscal-dialog ui-v2-dialog ui-v2-dialog--simple">
  <header class="dialog-head">
    <div class="dialog-title">
      <span class="dialog-symbol"><mat-icon aria-hidden="true">info</mat-icon></span>
      <div>
        <h2>Información fiscal adicional</h2>
        <p>Datos obtenidos en la consulta avanzada del RUC</p>
      </div>
    </div>
    <button type="button" appUiButton="close" (click)="close()" aria-label="Cerrar información fiscal">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>
  <div class="dialog-content">
    <dl class="fiscal-grid">
      <div *ngFor="let row of rows">
        <dt>{{row.label}}</dt>
        <dd>{{row.value}}</dd>
      </div>
    </dl>
    <p class="dialog-note">Información de solo consulta. Los datos pueden variar en los registros de SUNAT.</p>
  </div>
  <footer class="dialog-actions">
    <button type="button" appUiButton="secondary" (click)="close()">Cerrar</button>
  </footer>
</section>
