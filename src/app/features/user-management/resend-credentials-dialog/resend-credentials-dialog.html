<app-modal-shell
  type="subTask"
  title="Corregir correo y reenviar"
  [subtitle]="data.username + ' · Reemisión de credenciales'"
  icon="forward_to_inbox"
  [infoVisible]="false"
  [closeVisible]="false"
  [footerActions]="modalFooterActions"
  [busyActionId]="sending ? 'primary' : null"
  (actionClicked)="handleModalAction($event)"
  [contentScrollable]="false" (closeRequested)="close()">
  <section class="resend-modal">
  <div class="resend-modal__body">
    <p>Verifica el correo. Si estaba equivocado, corrígelo antes de enviar.
      El sistema generará <strong>otra contraseña temporal</strong> y anulará la anterior.</p>
    <label>Correo electrónico del usuario <span class="required">*</span>
      <input [(ngModel)]="email" type="email" maxlength="254" autocomplete="off"
        placeholder="correo@ejemplo.com"/>
    </label>
    <p class="resend-modal__note">
      La clave no se muestra al administrador. El usuario tendrá que cambiarla al ingresar.
    </p>
  </div>
  </section>
</app-modal-shell>
