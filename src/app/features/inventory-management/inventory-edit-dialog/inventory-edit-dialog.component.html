<app-modal-shell
  class="inventory-edit-modal"
  type="mainForm"
  title="Editar inventario"
  [subtitle]="'Almacén #' + data.inventory.id + ' · ' + data.inventory.inventoryName"
  icon="warehouse"
  [subtitleVisible]="false"
  [infoVisible]="true"
  infoTooltip="Actualiza el nombre técnico y el alias visible del almacén. Los artículos y movimientos existentes no se modifican."
  [sections]="[]"
  [sectionsVisible]="false"
  [footerActions]="modalFooterActions"
  [busyActionId]="saving ? 'primary' : null"
  [closeVisible]="false"
  [contentScrollable]="true"
  (actionClicked)="handleModalAction($event)"
  (closeRequested)="dialogRef.close()">
  <form (ngSubmit)="save()" class="edit-dialog-form" autocomplete="off">
    <div class="field">
      <label for="inv-edit-name">Nombre técnico <span class="required">*</span></label>
      <input id="inv-edit-name" [(ngModel)]="name" name="name"
        maxlength="255" placeholder="Ej. YosMG_Invent_1"
        required appUiControl />
      <small class="field-hint">Identificador interno del almacén u operativo.</small>
    </div>

    <div class="field">
      <label for="inv-edit-alias">Alias / Nombre visible <span class="optional">(opcional)</span></label>
      <input id="inv-edit-alias" [(ngModel)]="alias" name="alias"
        maxlength="255" placeholder="Ej. Almacén Central"
        appUiControl />
      <small class="field-hint">Nombre descriptivo visible en selectores y reportes.</small>
    </div>

    <p *ngIf="error" class="error-notice" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <span>{{ error }}</span>
    </p>
  </form>
</app-modal-shell>
