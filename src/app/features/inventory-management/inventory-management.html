<section class="inventory-manage-page inv-core-page">
  <header class="inv-core-header">
    <app-ui-page-heading icon="warehouse" title="Gestión de inventarios"
      subtitle="Inventarios operativos para artículos y existencias. Los maestros se mantienen separados."></app-ui-page-heading>
    <div class="inv-core-header-actions">
      <button type="button" appUiButton="secondary" class="reload" (click)="load(true)" [disabled]="loading || refreshing" [uiButtonLoading]="refreshing" [uiButtonLoadingText]="'Cargando...'">
        <mat-icon aria-hidden="true">refresh</mat-icon> Actualizar
      </button>
      <button *ngIf="canCreate" type="button" appUiButton="primary" (click)="openCreateDialog()"
        [disabled]="isManager && usersLoading" [uiButtonLoading]="isManager && usersLoading" [uiButtonLoadingText]="'Cargando usuarios...'">
        <mat-icon aria-hidden="true">add</mat-icon> Crear inventario
      </button>
    </div>
  </header>

  <section class="inv-manage-card">
    <div class="inv-manage-heading">
      <div>
        <h2>Inventarios disponibles</h2>
        <p>Propios y compartidos de tu empresa, según tus permisos.</p>
      </div>
      <a *ngIf="canManageAccess" routerLink="/dashboard/compartir-inventario" class="inv-manage-link">
        <mat-icon aria-hidden="true">group_add</mat-icon> Gestionar accesos
      </a>
    </div>

    <p *ngIf="error && !loading" class="inv-manage-error" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <span>{{ error }}</span>
    </p>

    <div class="inv-core-table-wrap inv-manage-table" appUiTablePaging="inventory-directory" [uiTablePagingLoading]="loading" *ngIf="loading || operational.length > 0">
      <table>
        <thead>
          <tr>
            <th scope="col">Inventario</th>
            <th scope="col">Propietario</th>
            <th scope="col">Estado</th>
            <th scope="col" class="inv-core-action-cell">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of paginatedOperational">
            <td>
              <strong>{{ row.alias || row.inventoryName }}</strong>
              <small>{{ row.inventoryName }} · ID {{ row.id }}</small>
            </td>
            <td>{{ ownerName(row.userId) }}</td>
            <td><app-ui-status label="Activo" tone="success" /></td>
            <td class="inv-core-action-cell">
              <button *ngIf="canManageAccess" type="button" appUiTableAction="normal"
                (click)="manageShares(row)" [disabled]="!isManager && row.userId !== selfId"
                [attr.aria-label]="'Compartir inventario ' + (row.alias || row.inventoryName)"
                title="Compartir inventario y administrar colaboradores">
                <mat-icon aria-hidden="true">group_add</mat-icon>
              </button>
              <button *ngIf="canCreate && (isManager || row.userId === selfId)" type="button" appUiTableAction="normal"
                (click)="edit(row)"
                [attr.aria-label]="'Editar inventario ' + (row.alias || row.inventoryName)"
                title="Editar nombre y alias del inventario">
                <mat-icon aria-hidden="true">edit</mat-icon>
              </button>
              <button *ngIf="canCreate && (isManager || row.userId === selfId)" type="button" appUiTableAction="danger"
                (click)="deactivate(row)"
                [attr.aria-label]="'Desactivar inventario ' + (row.alias || row.inventoryName)"
                title="Desactivar inventario">
                <mat-icon aria-hidden="true">block</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-ui-pagination *ngIf="operational.length" [totalItems]="operational.length" [page]="page" [pageSize]="pageSize" (pageChange)="page=$event" (pageSizeChange)="pageSize=$event;page=1" label="inventarios" loadingId="inventory-directory" />

    <app-ui-empty-state
      *ngIf="!loading && !operational.length && !error"
      icon="warehouse"
      message="No hay inventarios operativos registrados"
      hint="El inventario general no aparece aquí porque no almacena existencias." />
  </section>
</section>
