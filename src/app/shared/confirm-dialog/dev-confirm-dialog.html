<app-modal-shell
  type="confirmation"
  [title]="data.title"
  subtitle="Verifica los detalles antes de continuar"
  [icon]="data.icon"
  [infoVisible]="true"
  [closeVisible]="false"
  [footerActions]="modalFooterActions"
  (actionClicked)="handleModalAction($event)"
  [contentScrollable]="false" (closeRequested)="dialogRef.close()">
  <section class="confirm-shell">
  <div class="confirm-body">

    <p class="confirm-description">{{data.message}}</p>
    <div *ngIf="data.requiresReason" class="confirm-reason">
      <label for="confirm-reason-input">{{data.reasonLabel || 'Motivo de la operación'}}</label>
      <textarea id="confirm-reason-input"
                [(ngModel)]="reason"
                [attr.maxlength]="maxLength"
                rows="3"
                [placeholder]="data.reasonPlaceholder || 'Escribe el motivo...'"
                autocomplete="off"></textarea>
      <span class="confirm-counter">{{reason.length}} / {{maxLength}}</span>
    </div>
  
  </div>
  </section>
</app-modal-shell>
