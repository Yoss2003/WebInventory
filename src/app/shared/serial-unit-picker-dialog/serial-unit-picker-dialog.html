<app-modal-shell
  class="inv-modal-adaptive-height"
  type="selector"
  title="Seleccionar series"
  [subtitle]="articleName || 'Unidades serializadas disponibles'"
  icon="qr_code_2"
  [infoVisible]="false"
  [closeVisible]="false"
  [footerActions]="modalFooterActions"
  (actionClicked)="handleModalAction($event)"
  (closeRequested)="cancel()">
  <div class="serial-picker__body">
    <label class="serial-picker__search-label" for="serial-picker-search">Buscar serie o número de unidad</label>
    <div class="serial-picker__search">
      <mat-icon aria-hidden="true">search</mat-icon>
      <input id="serial-picker-search" type="search" [value]="search" (input)="onSearch($event)"
        autocomplete="off" placeholder="Escribe un número de serie..." />
    </div>

    <div class="serial-picker__actions">
      <span>{{visibleUnits.length}} disponibles</span>
      <span class="serial-picker__counter" aria-live="polite">{{selectedCount}} seleccionadas</span>
      <button type="button" appUiButton="secondary" (click)="selectAllVisible()"
        [disabled]="!visibleUnits.length || allVisibleSelected">Seleccionar visibles</button>
      <button type="button" appUiButton="secondary" (click)="clearAllVisible()"
        [disabled]="!selectedVisibleCount">Limpiar visibles</button>
    </div>

    <div class="serial-picker__list" role="group" aria-label="Series disponibles">
      <label class="serial-picker__option" *ngFor="let unit of visibleUnits; trackBy: trackByUnit">
        <mat-checkbox [checked]="selected.has(unit.id)" (change)="toggle(unit.id, $event.checked)">
          <span class="serial-picker__name">{{unit.serialNumber}}</span>
        </mat-checkbox>
        <span class="serial-picker__id">Unidad #{{unit.id}}</span>
      </label>
      <p class="serial-picker__empty" *ngIf="!visibleUnits.length">
        No se encontraron series con esa búsqueda.
      </p>
    </div>
  </div>
</app-modal-shell>
